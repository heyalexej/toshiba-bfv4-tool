[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toshiba-bfv4-tool"
version = "0.2.0"
description = "Community CLI for Toshiba B-FV4 and B-FV4D network management"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Community Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware",
]
dependencies = ["pydantic>=2,<3"]

[project.scripts]
toshiba-bfv4 = "toshiba_bfv4_tool.core:main"
toshiba-bfv4-lan = "toshiba_bfv4_tool.lan:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toshiba_bfv4_tool"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
